<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0c">
    <title>PiHub Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="calendar">
    <main class="screen">
        <header class="screen-header">
            <a class="brand" href="index.html"><i class="fa-brands fa-raspberry-pi"></i><span>PiHub</span></a>
            <time class="header-clock" data-live-clock>--:--</time>
        </header>

        <section class="calendar-page-content">
            <div class="calendar-view-header">
                <div>
                    <p id="calendar-view-label">
                        Today's schedule
                    </p>
        
                    <h1 id="calendar-view-title">
                        Calendar
                    </h1>
                </div>
        
                <div class="calendar-view-switcher">
                    <button
                        id="calendar-today-view"
                        class="calendar-view-button is-active"
                        type="button"
                    >
                        Today
                    </button>
        
                    <button
                        id="calendar-month-view"
                        class="calendar-view-button"
                        type="button"
                    >
                        Month
                    </button>
                </div>
            </div>
        
            <section
                id="calendar-agenda-view"
                class="calendar-view calendar-view--agenda"
            >
                <aside class="calendar-summary">
                    <div
                        class="calendar-summary__time"
                        data-live-clock
                    >
                        --:--
                    </div>
        
                    <div
                        class="calendar-summary__date"
                        id="calendar-date"
                    >
                        Loading…
                    </div>
        
                    <i class="fa-regular fa-calendar-days"></i>
                </aside>
        
                <section class="agenda">
                    <div class="section-kicker">
                        Today
                    </div>
        
                    <div
                        id="today-events"
                        class="agenda-list"
                    >
                        <div class="empty-message">
                            Loading today's schedule…
                        </div>
                    </div>
        
                    <div class="section-kicker section-kicker--later">
                        Tomorrow
                    </div>
        
                    <div
                        id="tomorrow-events"
                        class="agenda-list"
                    >
                        <div class="empty-message">
                            Loading tomorrow…
                        </div>
                    </div>
                </section>
            </section>
        
            <section
    id="calendar-month-container"
    class="calendar-view calendar-view--month"
    hidden
>
    <div class="month-calendar-panel">
        <div class="month-toolbar">
            <button
                id="month-previous"
                type="button"
                aria-label="Previous month"
            >
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <h2 id="month-title">
                Month
            </h2>

            <button
                id="month-next"
                type="button"
                aria-label="Next month"
            >
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="month-weekdays">
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
        </div>

        <div
            id="month-grid"
            class="month-grid"
        ></div>
    </div>

    <aside class="selected-day-panel">
        <header class="selected-day-panel__header">
            <div>
                <p id="selected-day-weekday">
                    Today
                </p>

                <h2 id="selected-day-date">
                    Select a day
                </h2>
            </div>

            <span id="selected-day-count">
                0 events
            </span>
        </header>

        <div
            id="selected-day-events"
            class="selected-day-events"
        >
            <div class="selected-day-empty">
                Tap a date to view its events.
            </div>
        </div>
    </aside>
</section>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a class="is-active" href="calendar.html"><i class="fa-regular fa-calendar"></i><span>Calendar</span></a>
            <a href="github.html"><i class="fa-brands fa-github"></i><span>GitHub</span></a>
            <a href="spotify.html"><i class="fa-brands fa-spotify"></i><span>Spotify</span></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </nav>
    </main>

    <script src="js/common.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
