<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0c">
    <title>PiHub Spotify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="spotify">
    <main class="screen">
        <header class="screen-header">
            <a class="brand" href="index.html"><i class="fa-brands fa-raspberry-pi"></i><span>PiHub</span></a>
            <div class="spotify-wordmark">Spotify <i class="fa-brands fa-spotify"></i></div>
        </header>

        <section class="spotify-page">
            <div class="spotify-art-wrap">
                <img id="spotify-art" alt="Album artwork" hidden>
                <div id="spotify-art-placeholder" class="spotify-art-placeholder">
                    <i class="fa-brands fa-spotify"></i>
                </div>
            </div>

            <div class="spotify-details">
                <span class="section-kicker">Now playing</span>
                <h1 id="spotify-title">No active playback</h1>
                <p id="spotify-artist">Start a song on a Spotify device</p>

                <div class="spotify-progress">
                    <div><span id="spotify-progress-fill"></span></div>
                    <small><span id="spotify-current">0:00</span><span id="spotify-duration">0:00</span></small>
                </div>

                <div class="spotify-controls">
                    <button id="spotify-prev" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="spotify-play" class="spotify-play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
                    <button id="spotify-next" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
                </div>

                <div class="spotify-volume">
                    <i class="fa-solid fa-volume-low"></i>
                    <input id="spotify-volume" type="range" min="0" max="100" value="50">
                </div>

                <button id="spotify-connect" class="primary-button" hidden>Connect Spotify</button>
                <small class="spotify-device" id="spotify-device">Checking Spotify…</small>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="calendar.html"><i class="fa-regular fa-calendar"></i><span>Calendar</span></a>
            <a href="github.html"><i class="fa-brands fa-github"></i><span>GitHub</span></a>
            <a class="is-active" href="spotify.html"><i class="fa-brands fa-spotify"></i><span>Spotify</span></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </nav>
    </main>

    <script src="js/common.js"></script>
    <script src="js/spotify.js"></script>
</body>
</html>
